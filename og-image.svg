<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e6edf3"/>
      <stop offset="50%" style="stop-color:#58a6ff"/>
      <stop offset="100%" style="stop-color:#3fb950"/>
    </linearGradient>
    <linearGradient id="stripe" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3fb950"/>
      <stop offset="50%" style="stop-color:#58a6ff"/>
      <stop offset="100%" style="stop-color:#bc8cff"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Grid pattern -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#30363d" stroke-width="0.5" opacity="0.4"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Top accent bar -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#stripe)"/>

  <!-- Left accent sidebar -->
  <rect x="0" y="0" width="6" height="630" fill="url(#stripe)"/>

  <!-- Main card -->
  <rect x="60" y="60" width="1080" height="510" rx="16" fill="#161b22" stroke="#30363d" stroke-width="1"/>

  <!-- Badge -->
  <rect x="100" y="100" width="320" height="34" rx="17" fill="#1a3626" stroke="#3fb950" stroke-width="1"/>
  <text x="260" y="122" font-family="monospace" font-size="12" fill="#3fb950" font-weight="700" text-anchor="middle" letter-spacing="1.5">STUDENT SCHOLAR — CSE (AI/ML)</text>

  <!-- Main title -->
  <text x="100" y="210" font-family="Arial, sans-serif" font-size="72" font-weight="800" fill="url(#titleGrad)">Git Workflow</text>
  <text x="100" y="290" font-family="Arial, sans-serif" font-size="72" font-weight="800" fill="url(#titleGrad)">Guide</text>

  <!-- Subtitle -->
  <text x="100" y="340" font-family="Arial, sans-serif" font-size="22" fill="#8b949e">Assignment Submission via GitHub — Step-by-Step Instructions</text>

  <!-- Divider line -->
  <line x1="100" y1="375" x2="1100" y2="375" stroke="#30363d" stroke-width="1"/>

  <!-- Tags row -->
  <!-- Tag 1: Phase 1 -->
  <rect x="100" y="395" width="180" height="36" rx="8" fill="#2d1a0a" stroke="#f0883e" stroke-width="1"/>
  <text x="190" y="418" font-family="monospace" font-size="13" fill="#f0883e" font-weight="700" text-anchor="middle">⚙ Phase 1: Setup</text>

  <!-- Tag 2: Phase 2 -->
  <rect x="294" y="395" width="200" height="36" rx="8" fill="#1e1035" stroke="#bc8cff" stroke-width="1"/>
  <text x="394" y="418" font-family="monospace" font-size="13" fill="#bc8cff" font-weight="700" text-anchor="middle">📌 Phase 2: Use Cases</text>

  <!-- Tag 3: Branches -->
  <rect x="508" y="395" width="190" height="36" rx="8" fill="#0d1f38" stroke="#58a6ff" stroke-width="1"/>
  <text x="603" y="418" font-family="monospace" font-size="13" fill="#58a6ff" font-weight="700" text-anchor="middle">🌿 Branch Workflow</text>

  <!-- Tag 4: Commands -->
  <rect x="712" y="395" width="180" height="36" rx="8" fill="#0a2428" stroke="#39d0d8" stroke-width="1"/>
  <text x="802" y="418" font-family="monospace" font-size="13" fill="#39d0d8" font-weight="700" text-anchor="middle">📚 Command Ref</text>

  <!-- Author section -->
  <text x="100" y="490" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#e6edf3">Veera Raghavan</text>
  <text x="100" y="520" font-family="Arial, sans-serif" font-size="16" fill="#8b949e">Computer Science and Engineering (AI/ML)  ·  1st Year  ·  SRM IST, Kattankulathur</text>

  <!-- Right code snippet decoration -->
  <rect x="820" y="160" width="300" height="190" rx="10" fill="#010409" stroke="#30363d" stroke-width="1"/>
  <text x="840" y="190" font-family="monospace" font-size="13" fill="#3fb950">$ git checkout -b feature/uc1</text>
  <text x="840" y="215" font-family="monospace" font-size="13" fill="#8b949e"># write your code</text>
  <text x="840" y="240" font-family="monospace" font-size="13" fill="#3fb950">$ git add .</text>
  <text x="840" y="265" font-family="monospace" font-size="13" fill="#3fb950">$ git commit -m "uc1 done"</text>
  <text x="840" y="290" font-family="monospace" font-size="13" fill="#3fb950">$ git push origin feature/uc1</text>
  <text x="840" y="315" font-family="monospace" font-size="13" fill="#8b949e"># create pull request</text>
  <text x="840" y="340" font-family="monospace" font-size="13" fill="#3fb950">$ git checkout develop</text>
</svg>